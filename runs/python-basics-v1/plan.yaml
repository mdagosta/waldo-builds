# Pretraining of waldito-python-basics (2026-09-29 build), recreated on the network: same model,
# data shards, and round sizes. Post-training comes later as a plan continuing from this run's merge.
name: python-basics-v1
units: [u0, u1, u2]
replicas: 2
merge: mean
store: huggingface
identities:
  mdagosta:
    key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHrTASJTB93+iPk08jk+9LIfNCBzFKQ5aqN0aQeizxii
    hf: mdagosta
  mdagosta-b:
    key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFTcqwpObmnREvS0Bf7MOPBp5tEmcELDjH4RjgEgv5N3
    hf: mdagosta

pretrain:
  compose: pretrain.yaml.tmpl  # 384 hidden, 6 layers, byte tokenizer, batch 32 x 512
  bootstrap_tokens: 2000000    # round 0: shared starting weights on all shards
  rounds: 4
  tokens_per_round: 8192000    # 500 steps per unit; small shards repeat (flask + httpie ~7 passes)
  shards:
    u0: [TheAlgorithms/Python]
    u1: [pallets/flask, httpie/cli]
    u2: [nvbn/thefuck, psf/requests]

min_steps_per_round: 200       # 72 steps failed, ~200+ worked
replica_tolerance: 0.25
