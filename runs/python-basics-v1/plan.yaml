# waldito-python-basics (2026-09-29 build), recreated on the network: same model, data shards,
# and round sizes. Rounds 1-4 pretrain; round 4's merge.yaml pins the pretrained base for anyone
# who wants to post-train it their own way. Rounds 5-14 post-train it here.
name: python-basics-v1
units: [u0, u1, u2]
replicas: 2
merge: mean
store: huggingface
identities:
  mdagosta:
    key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHrTASJTB93+iPk08jk+9LIfNCBzFKQ5aqN0aQeizxii
    hf: mdagosta
  mdagosta-b:
    key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFTcqwpObmnREvS0Bf7MOPBp5tEmcELDjH4RjgEgv5N3
    hf: mdagosta

pretrain:
  compose: pretrain.yaml.tmpl  # 384 hidden, 6 layers, byte tokenizer, batch 32 x 512
  bootstrap_tokens: 2000000    # round 0: shared starting weights on all shards
  rounds: 4
  tokens_per_round: 8192000    # 500 steps per unit; small shards repeat (flask + httpie ~7 passes)
  shards:
    u0: [TheAlgorithms/Python]
    u1: [pallets/flask, httpie/cli]
    u2: [nvbn/thefuck, psf/requests]

posttrain:
  compose: sft.yaml.tmpl       # same architecture; conversation template, assistant-only loss
  data: ~/src/openwaldo/post-training-data/data/sft/python-basics-v4/train/part-00000.jsonl
  shard_by: record-hash        # one shard per unit, ingested locally by each identity
  fetcher: ~/.waldo/waldito/fetchers/python-basics-v4.ini
  rounds: 10                   # ~2250 steps per unit, matching the single model's 2206 (371/374)
  epochs_per_round: 8          # ~230 steps on a third of python-basics-v4

min_steps_per_round: 200       # 72 steps failed, ~200+ worked
replica_tolerance: 0.25
