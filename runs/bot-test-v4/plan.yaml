# Burn-in: about 40 minutes of five identities at throttle 0.2 with random protocol faults
# injected by waldo's testing/join/burnin.py (FAULT_RATE=0.3): lazy, copied, and stale-base
# submissions, silent claims, dishonest merges, forged and future-dated claims. The honest
# majority must keep every round correct; `burnin.py report runs/bot-test-v4` checks each fault.
kind: waldo-join-plan
schema: 1
name: bot-test-v4
units: [u0, u1, u2]
replicas: 3
closers: 3
claim_minutes: 10              # silent claims are retaken within the run
merge: mean
store: huggingface
identities:
